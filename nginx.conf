# Configuración de Nginx para el sitio estático (despliegue en Coolify).
#
# Resuelve dos cosas que el servidor por defecto no hace bien con una build
# estática de Astro:
#
# 1. Las rutas sin extensión (/about, /donate…) se sirven desde su carpeta
#    (/about/index.html) sin redirecciones raras.
# 2. Una URL inexistente devuelve el 404 de la fundación CON código HTTP 404.
#    Esto importa: un `try_files … /index.html` (configuración típica de SPA)
#    respondería 200 y los rastreadores —incluidos los de las plataformas de
#    verificación— indexarían páginas fantasma como si existieran.
#
# 3. /media/<archivo> se reenvía al CMS (que lo guarda en uploads/) y se
#    cachea: las imágenes y documentos de Strapi salen desde
#    www.minkayni.org/media/<archivo>, no desde strapi.minkayni.org
#    (ver src/utils/media-url.ts).
#
# En Coolify: aplicar en el recurso del frontend, en la configuración
# personalizada de Nginx del despliegue estático. Este archivo se incluye
# dentro del bloque http{} de Nginx, por eso proxy_cache_path puede ir aquí.

# Caché en disco de los medios del CMS. Las claves llevan hash en el nombre,
# así que un fichero nunca cambia bajo la misma URL: 30 días es conservador.
# 2 GB caben de sobra en el contenedor; si se llena, Nginx expulsa lo menos usado.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:20m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir lo que se sirve como texto. Nivel 6 y no el 1 por defecto: la
    # hoja de estilos pasa de 27 a 22 KB y el HTML de la portada de 43 a 38 KB
    # a cambio de un coste de CPU que en un sitio estático no se nota.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml;

    # Assets con hash en el nombre: caché larga e inmutable
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Medios del CMS por el dominio de la web. La URL pública es
    # /media/<archivo>; Strapi los tiene en /media/uploads/<archivo> (uploads/
    # es la carpeta interna de su almacén y no debe verse), así que el rewrite
    # añade ese tramo antes de reenviar. Strapi firma y sirve desde su almacén;
    # aquí solo se reenvía y se cachea. `set $cms` + `resolver` hacen que el
    # nombre se resuelva periódicamente y no quede fijado —o falle— si la IP
    # del CMS cambia detrás de Cloudflare. La query (?w=…) se conserva: es
    # parte de la clave de caché.
    location /media/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $cms "https://strapi.minkayni.org";
        rewrite ^/media/(.*)$ /media/uploads/$1 break;
        proxy_pass $cms;
        proxy_ssl_server_name on;
        proxy_set_header Host strapi.minkayni.org;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_cache media;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;

        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache $upstream_cache_status;
    }

    # HTML: siempre revalidar para que un redeploy se vea al instante
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # Sitio en inglés. Se comporta igual que el resto salvo en una cosa: su
    # 404 es el inglés. Sin este bloque, un enlace roto bajo /en/ devolvería
    # la página de error en español, que es justo el idioma que el visitante
    # ya ha dicho que no quiere. `^~` gana al bloque `/` de arriba.
    location ^~ /en/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /en/404/index.html;
    }

    # Página 404 de la fundación, servida con código 404 real
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # El 404 español lo compila Astro como /404.html porque trata esa ruta de
    # forma especial; el del idioma es una página normal, así que sale en
    # /en/404/index.html. Se apunta al fichero real en vez de renombrarlo en el
    # despliegue, que sería un paso más que se olvida.
    location = /en/404/index.html {
        internal;
    }
}
