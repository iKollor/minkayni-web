# Configuración de Nginx para el sitio estático (despliegue en Coolify).
#
# Resuelve dos cosas que el servidor por defecto no hace bien con una build
# estática de Astro:
#
# 1. Las rutas sin extensión (/about, /donate…) se sirven desde su carpeta
#    (/about/index.html) sin redirecciones raras.
# 2. Una URL inexistente devuelve el 404 de la fundación CON código HTTP 404.
#    Esto importa: un `try_files … /index.html` (configuración típica de SPA)
#    respondería 200 y los rastreadores —incluidos los de las plataformas de
#    verificación— indexarían páginas fantasma como si existieran.
#
# En Coolify: aplicar en el recurso del frontend, en la configuración
# personalizada de Nginx del despliegue estático.

server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir lo que se sirve como texto
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # Assets con hash en el nombre: caché larga e inmutable
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML: siempre revalidar para que un redeploy se vea al instante
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # Página 404 de la fundación, servida con código 404 real
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
