/* Tokens de marca: los mismos de src/styles/global.css del sitio. */
:root {
    --text: #0a0801;
    --bg-black: #0a0801;
    --bg-white: #fff6e5;
    --primary: #6e00a3;
    --primary-deep: #410063;
    --secondary: #3fa9f5;
    --secondary-deep: #166fb0;
    --secondary-light: #a6d8fb;
    --accent: #f3a20b;
    --surface: #dedbd4;

    --font-display: "Aristotelica Pro Display", "Nunito", system-ui, sans-serif;
    --font-text: "Aristotelica Pro Text", "Nunito", system-ui, sans-serif;

    --ease-apple: cubic-bezier(0.4, 0, 0.6, 1);
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    font-family: var(--font-text);
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

html,
body {
    margin: 0;
    padding: 0;
    color: var(--text);
    /* Transparente: por fuera de cada bloque se ve el fondo crema del tema. */
    background: transparent;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

h1,
h2,
h3,
p,
ul {
    margin: 0;
}

ul {
    padding: 0;
    list-style: none;
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

/* Botón «mágico» del sitio (Button.astro): píldora celeste, texto crema en
   mayúsculas; al pasar el cursor la etiqueta alternativa sube y aparece el
   brillo de colores. Versión solo CSS de scripts/magic-button.ts. */
.magic-btn {
    --btn-bg: var(--secondary);
    --btn-bg-hover: #4cede1;
    --btn-text: var(--bg-white);
    position: relative;
    display: inline-block;
    isolation: isolate;
    border-radius: 9999px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 18px;
    text-transform: uppercase;
    color: var(--btn-text);
    user-select: none;
}
.magic-btn__surface {
    position: relative;
    z-index: 1;
    display: inline-grid;
    place-items: center;
    overflow: hidden;
    padding: 0.45em 1.3rem;
    border-radius: 9999px;
    background: var(--btn-bg);
    white-space: nowrap;
    transition: background-color 0.35s var(--ease-apple);
}
.magic-btn__label {
    grid-area: 1 / 1;
    transition: transform 0.45s cubic-bezier(0.34, 1.35, 0.4, 1);
}
.magic-btn__label--hover {
    transform: translateY(160%);
}
.magic-btn__glow {
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: 9999px;
    background: linear-gradient(20deg, #00f8f1, #ffbd1e 33%, #fe848f 66%, #00f8f1);
    background-size: 100% 200%;
    filter: blur(5px);
    opacity: 0;
    transition: opacity 0.35s var(--ease-apple);
}
.magic-btn:hover .magic-btn__label--default,
.magic-btn:focus-visible .magic-btn__label--default {
    transform: translateY(-160%);
}
.magic-btn:hover .magic-btn__label--hover,
.magic-btn:focus-visible .magic-btn__label--hover {
    transform: translateY(0);
}
.magic-btn:hover .magic-btn__glow,
.magic-btn:focus-visible .magic-btn__glow {
    opacity: 1;
    animation: glow-shift 5s linear infinite;
}
.magic-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
}
@keyframes glow-shift {
    to {
        background-position: 0% 200%;
    }
}

/* Botón de contorno (el «Aporta hoy» del footer). */
.outline-btn {
    display: inline-flex;
    min-height: 48px;
    align-items: center;
    justify-content: center;
    padding: 12px 28px;
    border: 2px solid rgb(255 246 229 / 0.8);
    border-radius: 9999px;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--bg-white);
    transition:
        transform 0.2s var(--ease-apple),
        background-color 0.2s var(--ease-apple),
        border-color 0.2s var(--ease-apple),
        color 0.2s var(--ease-apple);
}
.outline-btn:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    background: var(--accent);
    color: var(--bg-black);
}
.outline-btn:focus-visible {
    outline: 2px solid var(--bg-white);
    outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}


html,
body {
    height: 100%;
}

.hero {
    position: relative;
    display: flex;
    height: 100%;
    min-height: 240px;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 0 0 30px 30px;
    background-image: linear-gradient(to bottom right, oklch(0.38 0.19 294), oklch(0.38 0.14 259));
    contain: paint;
}

/* Fondo de burbujas (index/BubbleBackground.astro) con la paleta del hero. */
.bubbles {
    --second: 18, 113, 255;
    --third: 140, 100, 255;
    --fourth: 63, 169, 245;
    --fifth: 140, 100, 255;
    position: absolute;
    inset: 0;
    filter: blur(40px);
}
.bubbles::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(38% 34% at 50% 52%, rgba(120, 200, 250, 0.7) 0%, rgba(63, 169, 245, 0.4) 45%, rgba(63, 169, 245, 0) 100%),
        radial-gradient(75% 70% at 48% 50%, rgba(40, 120, 250, 0.55) 0%, rgba(90, 110, 250, 0.35) 45%, rgba(140, 100, 255, 0) 100%);
}
.orbit {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: orbit linear infinite;
}
.orbit--a {
    transform-origin: calc(50% - 400px);
    animation-duration: 20s;
}
.orbit--b {
    transform-origin: calc(50% + 400px);
    animation-duration: 40s;
}
.orbit--c {
    transform-origin: calc(50% - 800px) calc(50% + 200px);
    animation-duration: 20s;
}
.blob {
    position: absolute;
    display: block;
    border-radius: 9999px;
    mix-blend-mode: hard-light;
}
.blob--second {
    top: 10%;
    left: 10%;
    width: 80%;
    height: 80%;
    background: radial-gradient(circle at center, rgba(var(--second), 0.8) 0%, rgba(var(--second), 0) 50%);
}
.blob--third {
    top: calc(50% + 200px);
    left: calc(50% - 500px);
    width: 80%;
    height: 80%;
    background: radial-gradient(circle at center, rgba(var(--third), 0.8) 0%, rgba(var(--third), 0) 50%);
}
.blob--fourth {
    top: 10%;
    left: 10%;
    width: 80%;
    height: 80%;
    opacity: 0.7;
    background: radial-gradient(circle at center, rgba(var(--fourth), 0.8) 0%, rgba(var(--fourth), 0) 50%);
    animation: sway 40s ease-in-out infinite;
}
.blob--fifth {
    top: calc(50% - 80%);
    left: calc(50% - 80%);
    width: 160%;
    height: 160%;
    background: radial-gradient(circle at center, rgba(var(--fifth), 0.8) 0%, rgba(var(--fifth), 0) 50%);
}
@keyframes orbit {
    to {
        transform: rotate(360deg);
    }
}
@keyframes sway {
    0%,
    100% {
        transform: translate3d(-50px, 0, 0);
    }
    50% {
        transform: translate3d(50px, 0, 0);
    }
}

.hero__title {
    position: relative;
    z-index: 1;
    max-width: min(100%, 18ch);
    margin: 0 auto;
    padding: 0.08em 24px;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(2.75rem, 13vw, 8rem);
    line-height: 0.84;
    letter-spacing: -0.02em;
    text-align: center;
    text-wrap: balance;
    color: var(--bg-white);
}
</style>
</head>
<body>
<header class="hero">
    <div class="bubbles" aria-hidden="true">
        <div class="orbit orbit--a"><span class="blob blob--second"></span></div>
        <div class="orbit orbit--b"><span class="blob blob--third"></span></div>
        <span class="blob blob--fourth"></span>
        <div class="orbit orbit--c"><span class="blob blob--fifth"></span></div>
    </div>
    <!-- ✏️ Cambia aquí el título de la página -->
    <h1 class="hero__title">Conócenos</h1>
</header>
</body>
</html>
